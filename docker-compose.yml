services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domain_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domain_copilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-domain_copilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domain_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qdrant_storage:
  postgres_data:
