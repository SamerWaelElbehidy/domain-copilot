services:
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Required (>= 32 chars, not a placeholder) when APP_ENV is not "development".
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password-change-me}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-domain_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domain_copilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-domain_copilot}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      LLM_PROVIDER_CHAIN: ${LLM_PROVIDER_CHAIN:-ollama}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      LLM_PRICES: ${LLM_PRICES:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_FAILURE_THRESHOLD: ${LLM_FAILURE_THRESHOLD:-3}
      LLM_COOLDOWN_SECONDS: ${LLM_COOLDOWN_SECONDS:-30}
      RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD:-0.73}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      LOGIN_ATTEMPTS_PER_MINUTE: ${LOGIN_ATTEMPTS_PER_MINUTE:-5}
      ASK_PER_MINUTE: ${ASK_PER_MINUTE:-20}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1000000}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10000000}
      SEED_CORPUS: ${SEED_CORPUS:-true}
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domain_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domain_copilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-domain_copilot}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domain_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local, free model server. The first start downloads the models (about
  # 2 GB) into the ollama_models volume; later starts reuse them.
  ollama:
    image: ollama/ollama:0.34.4
    environment:
      # Keep the model in memory between questions; a cold load on CPU can
      # take longer than a request is allowed to wait.
      OLLAMA_KEEP_ALIVE: 24h
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.34.4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint:
      - sh
      - -c
      # Pull both models, then load the chat model once so the first user question is not the cold one.
      - ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text} && ollama pull ${OLLAMA_CHAT_MODEL:-qwen2.5:3b} && ollama run ${OLLAMA_CHAT_MODEL:-qwen2.5:3b} "ready" > /dev/null
    restart: "no"

volumes:
  qdrant_storage:
  postgres_data:
  ollama_models:
