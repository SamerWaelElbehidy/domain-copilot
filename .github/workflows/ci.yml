name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Postgres so the migrations and adapters are exercised on every PR.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: domain_copilot
          POSTGRES_PASSWORD: domain_copilot_dev
          POSTGRES_DB: domain_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domain_copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt ruff pip-audit
      - name: Build validation (compile, import every module, validate compose file)
        run: |
          python -m compileall -q src scripts
          PYTHONPATH=src python -c "import pkgutil, importlib, sys; sys.path.insert(0, 'src'); [importlib.import_module(m.name) for pkg in ('domain','application','infrastructure') for m in pkgutil.walk_packages(importlib.import_module(pkg).__path__, pkg + '.')]"
          docker compose config -q
          docker build -q -t domain-copilot:ci .
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests (live Ollama tests skip automatically; Postgres tests run)
        run: python -m pytest tests -q
      - name: Dependency scan
        run: pip-audit -r requirements.lock

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
